url: https://github.com/PerryLink/dsh-draw
name: PerryLink/dsh-draw
category: vision
description:
  en: Unified static-image generation router for DeepSeek Harness that exposes one image_generate tool with config-driven routing across OpenAI Images, Zhipu CogView, and any OpenAI-compatible endpoint, with health-aware fallback, durable workspace attachment results, per-session quota accounting, an in-conversation result card, and a Plugins settings panel.
  zh: DeepSeek Harness 的统一静态图像生成路由：通过一个 image_generate 工具在 OpenAI Images、Zhipu CogView 及任意 OpenAI 兼容端点之间按配置路由，具备健康感知回退、持久化工作区附件、按会话配额记账、会话内结果卡片和 Plugins 设置面板。
