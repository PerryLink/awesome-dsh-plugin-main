url: https://github.com/PerryLink/dsh-session-sync
name: PerryLink/dsh-session-sync
category: session
description:
  en: Sync DeepSeek Harness sessions across devices via a dedicated git mirror of the session store, with append-only three-way merge, keep-both conflict resolution, a /sync command, sync_pull/sync_push/sync_status tools, and configurable auto push/pull.
  zh: 跨设备同步 DeepSeek Harness 会话：通过专用的 git 会话存储镜像进行仅追加的三方合并与 keep-both 冲突解决，提供 /sync 命令、sync_pull/sync_push/sync_status 工具，并支持可配置的自动推拉。
