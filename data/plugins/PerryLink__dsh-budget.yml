url: https://github.com/PerryLink/dsh-budget
name: PerryLink/dsh-budget
category: usage
description:
  en: Cost governance for DeepSeek Harness that meters token usage and cost per model, session, and day, enforces session, daily, and monthly budget caps with threshold alerts and over-limit policies, and adds carbon footprint estimation, per-model latency benchmarks, a Settings budget tab, and the /budget command.
  zh: DeepSeek Harness 的成本治理：按模型、会话和天聚合统计 token 用量与成本，实施会话、日、月预算上限与阈值告警和超限策略，并提供碳足迹估算、分模型延迟基准、Settings 预算页和 /budget 命令。
