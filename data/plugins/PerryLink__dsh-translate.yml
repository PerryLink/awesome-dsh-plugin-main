url: https://github.com/PerryLink/dsh-translate
name: PerryLink/dsh-translate
category: model
description:
  en: Vendor parameter translation and deterministic JSON repair for DeepSeek Harness; the /translate command maps temperature, top_p, max_tokens, stop, and system across 11 vendors, and a post-execute repair layer with the fix_json tool fixes broken JSON tool output without fabricating data.
  zh: DeepSeek Harness 的厂商参数翻译与确定性 JSON 修复：/translate 命令在 11 家厂商之间映射 temperature、top_p、max_tokens、stop、system 参数，post-execute 修复层与 fix_json 工具在不编造数据的前提下修复损坏的 JSON 工具输出。
